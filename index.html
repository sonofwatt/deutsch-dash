<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f2ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171613" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png" />
    <!-- iOS ignores SVG touch icons, so add-to-home-screen needs a real PNG -->
    <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png" />
    <!-- Add-to-home-screen used to give a nameless shortcut in a browser tab. Every
         path inside the manifest is relative to the manifest itself, which is what
         makes it work under the Pages subpath and at the root alike. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- Outfit, served from here rather than from Google. One fewer third party
         on every page load (a font request discloses the player's IP address,
         which in the EU is personal data), one fewer render-blocking request
         on the critical path, and the game still paints when Google Fonts is
         slow or blocked. One variable file per script covers all three weights.
         SIL Open Font License: see fonts/OFL.txt. -->
    <link rel="preload" href="./fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face { font-family: "Outfit"; font-style: normal; font-weight: 100 900; font-display: swap;
        src: url(./fonts/outfit-latin.woff2) format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: "Outfit"; font-style: normal; font-weight: 100 900; font-display: swap;
        src: url(./fonts/outfit-latin-ext.woff2) format("woff2");
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
    </style>
    <title>Deutsch Dash</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
