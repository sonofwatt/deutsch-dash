<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="512" height="512">
  <!-- FULL BLEED on purpose: the tile fills the canvas and iOS and Android mask
       the corners themselves. An inset tile with its own margin comes back as a
       small icon in a black square, because iOS composites transparency onto
       black and then rounds what it is given a second time. The rounding here is
       for the browser tab, which masks nothing. -->
  <rect id="tile" width="300" height="300" rx="68" fill="#15233F"/>
  <!-- The art was drawn against a 380 canvas with the tile inset at 40,40. The
       translate carries that composition onto this one unchanged: its own 14,-13
       less the 40,40 the tile lost. -->
  <g id="art" transform="translate(-26,-53)">
    <g stroke="#4FD1C5" stroke-linecap="round" opacity="0.75">
      <line x1="72" y1="160" x2="112" y2="160" stroke-width="9"/>
      <line x1="64" y1="200" x2="118" y2="200" stroke-width="9"/>
      <line x1="72" y1="240" x2="112" y2="240" stroke-width="9"/>
    </g>
    <g transform="rotate(-22 210 200)">
      <rect x="155" y="128" width="112" height="152" rx="14" fill="#8FA6D8"/>
    </g>
    <g transform="rotate(-7 210 200)">
      <rect x="155" y="126" width="112" height="152" rx="14" fill="#DDE6F7"/>
    </g>
    <g transform="rotate(9 210 200)">
      <rect x="155" y="124" width="112" height="152" rx="14" fill="#FFFFFF"/>
      <rect x="168" y="137" width="34" height="9" rx="4.5" fill="#F0642F"/>
      <path d="M211 172L242 200L211 228L180 200Z" fill="#F0642F"/>
      <rect x="220" y="256" width="34" height="9" rx="4.5" fill="#15233F" opacity="0.35"/>
    </g>
  </g>
</svg>
