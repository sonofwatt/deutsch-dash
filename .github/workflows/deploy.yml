name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
# Read-only for the build job. It is where the untrusted work happens - npm ci,
# the test suites, the emulator, a browser - and none of it needs to publish.
# The two grants that deploy a Pages site are on the deploy job alone, below.
permissions:
  contents: read
# Never cancel a deployment mid-flight: GitHub's own Pages starter sets this to
# false for that reason. Two quick pushes now both run to completion, the second
# simply publishing after the first.
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES_BASE: /${{ github.event.repository.name }}/
    steps:
      # Every action here is on a major that runs on Node 24. The runner deprecated
      # Node 20 on 2025-09-19 and has been forcing those actions onto 24 with a
      # warning since; when it stops forcing, a v4 pinned here would simply fail.
      - uses: actions/checkout@v7
        with:
          # Nothing after the checkout talks to git, so the job token has no
          # business sitting in .git/config for the rest of the run.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # The emulator suite is the ONLY thing that exercises database.rules.json,
      # and `firebase emulators:exec` needs a JVM to run the database emulator.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      # The database emulator jar (~30MB) is fetched on first run; cache it so a
      # slow or flaky CDN cannot turn the rules tests into a red build. A cache
      # entry is immutable once saved, so the key carries the lockfile hash: a
      # firebase-tools bump that wants a newer jar gets a fresh entry, seeded from
      # the old one through restore-keys, rather than restoring a stale jar and
      # re-downloading the new one on every run for ever.
      - name: Cache Firebase emulator jars
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            firebase-emulators-${{ runner.os }}-
      # Chromium for the layout suite, keyed on the lockfile so a Playwright bump
      # fetches the browser that version expects rather than reusing the old one.
      # Any other dependency change refetches it too, which is the price of not
      # having to read the installed version out in a step of its own.
      - name: Cache the Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      # test:emu, NOT `npm test`. It runs the same 15 files plus the emulator, so
      # it is a strict superset - and it is the only run in which the rules tests
      # execute at all. They gate on EMULATOR=1 via describe.runIf and otherwise
      # SKIP, which reports green: without this step a change that broke
      # database.rules.json would sail through CI unnoticed. The guard in
      # src/net/emulatorCoverage.test.ts fails if this line ever goes away.
      - run: npm run test:emu
      # The only tests that measure anything rather than reading markup. They need
      # a browser, so it is fetched here and cached above; without this step they
      # SKIP and report green, which is what tableauLayoutCoverage.test.ts guards.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:layout
      - run: npm run build
      # v4 of this one stopped putting hidden files in the artifact. `dist` has
      # none, checked, so there is nothing here for that to drop.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
